<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>For Cutee Kakeee ❤️</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%);
      overflow-x: hidden;
      padding: 20px;
      position: relative;
    }

    .heart-bg {
      position: fixed;
      bottom: -50px;
      font-size: 24px;
      animation: floatUp linear infinite;
      opacity: 0.7;
      z-index: 1;
      pointer-events: none;
    }

    @keyframes floatUp {
      0% {
        transform: translateY(0) rotate(0deg) scale(0.8);
        opacity: 0.8;
      }
      100% {
        transform: translateY(-110vh) rotate(360deg) scale(1.4);
        opacity: 0;
      }
    }

    .card {
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(10px);
      padding: 35px 25px;
      border-radius: 25px;
      box-shadow: 0 15px 35px rgba(255, 75, 114, 0.25);
      text-align: center;
      max-width: 480px;
      width: 100%;
      z-index: 10;
      transition: all 0.4s ease;
      animation: popIn 0.6s ease;
    }

    /* Har step change hone par smooth card animation */
    @keyframes popIn {
      0% {
        opacity: 0;
        transform: scale(0.85) translateY(20px);
      }
      100% {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
    }

    .step-animate {
      animation: fadeSlideUp 0.7s ease forwards;
    }

    @keyframes fadeSlideUp {
      0% {
        opacity: 0;
        transform: translateY(18px) scale(0.95);
      }
      100% {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .emoji-header {
      font-size: 60px;
      display: inline-block;
      animation: pulse 1.2s infinite;
      margin-bottom: 12px;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.18); }
    }

    h1 {
      color: #d6336c;
      font-size: 26px;
      margin-bottom: 14px;
    }

    p {
      color: #555;
      font-size: 18px;
      line-height: 1.5;
      margin-bottom: 24px;
    }

    /* Bubu Dudu GIF Styling */
    .cute-gif {
      width: 160px;
      height: auto;
      border-radius: 15px;
      margin: 5px auto 15px auto;
      display: block;
    }

    .shayari-box {
      background: linear-gradient(135deg, #fff0f3 0%, #ffe5ec 100%);
      border-left: 4px solid #ff4d6d;
      padding: 18px 16px;
      border-radius: 15px;
      margin: 18px 0 24px 0;
      color: #800f2f;
      font-size: 15.5px;
      line-height: 1.75;
      font-style: italic;
      box-shadow: 0 4px 12px rgba(255, 77, 109, 0.12);
    }

    .thanks-msg {
      background: rgba(255, 240, 243, 0.85);
      border: 1.5px dashed #ff758f;
      padding: 18px;
      border-radius: 15px;
      color: #a4133c;
      font-size: 15.5px;
      line-height: 1.7;
      font-weight: 600;
      margin-top: 12px;
      box-shadow: 0 4px 15px rgba(255, 117, 143, 0.15);
    }

    .btn-group {
      display: flex;
      justify-content: center;
      gap: 20px;
      position: relative;
      min-height: 55px;
    }

    button {
      padding: 12px 30px;
      font-size: 17px;
      font-weight: bold;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      transition: all 0.25s ease;
      box-shadow: 0 6px 15px rgba(0, 0, 0, 0.12);
    }

    .primary-btn {
      background: #ff4d6d;
      color: white;
    }

    .primary-btn:hover {
      background: #c9184a;
      transform: scale(1.08);
    }

    #noBtn {
      background: #e9ecef;
      color: #495057;
      position: relative;
    }
  </style>
</head>
<body>

  <!-- 1st Animation: Initial Proposal -->
  <div class="card" id="proposalCard">
    <div id="cardContent" class="step-animate">
      <div class="emoji-header" id="mainEmoji">🥺👉👈</div>
      <h1 id="titleText">Hey Cutee Kakeee! ❤️</h1>
      <div id="subText">
        <p><strong>Will you be mine forever? 💍✨</strong></p>
      </div>

      <div class="btn-group" id="btnGroup">
        <button class="primary-btn" onclick="showStep2()">Yes! 😍</button>
        <button id="noBtn" onmouseover="moveNoButton()" ontouchstart="moveNoButton()">No 🙈</button>
      </div>
    </div>
  </div>

  <script>
    function moveNoButton() {
      const noBtn = document.getElementById('noBtn');
      const maxX = window.innerWidth - noBtn.offsetWidth - 30;
      const maxY = window.innerHeight - noBtn.offsetHeight - 30;

      const randomX = Math.max(20, Math.floor(Math.random() * maxX));
      const randomY = Math.max(20, Math.floor(Math.random() * maxY));

      noBtn.style.position = 'fixed';
      noBtn.style.left = randomX + 'px';
      noBtn.style.top = randomY + 'px';
    }

    function triggerAnimation(htmlContent) {
      const contentBox = document.getElementById('cardContent');
      contentBox.classList.remove('step-animate');
      void contentBox.offsetWidth; // Reflow to restart animation
      contentBox.innerHTML = htmlContent;
      contentBox.classList.add('step-animate');
    }

    function burstHearts(count) {
      for (let i = 0; i < count; i++) {
        setTimeout(createHeart, i * 60);
      }
    }

    // 2nd Animation: Celebration Screen with Bubu Dudu Kiss GIF
    function showStep2() {
      triggerAnimation(`
        <div class="emoji-header">🥰🎉💖</div>
        <h1>Yayyy! I Knew It! ❤️</h1>
        <img src="https://media.tenor.com/gUiu1zyxfzYAAAAi/bear-kiss-bear-kisses.gif" alt="Bubu Dudu Kissing" class="cute-gif" />
        <p><strong>You just made my day! ❤️✨</strong></p>
        <div class="btn-group">
          <button class="primary-btn" onclick="showStep3()">Kuch Kehna Hai Tumse 💌✨</button>
        </div>
      `);
      burstHearts(25);
    }

    // 3rd Animation: Shayari Screen
    function showStep3() {
      triggerAnimation(`
        <div class="emoji-header">🌹✨💖</div>
        <h1>For My Kuchu Puchuu 🥰❤️</h1>
        <div class="shayari-box">
          Tum itni haseen kaise ho jnna...!<br>
          Kya khubsurat lfz tumhe dekh k bnna h?<br>
          Tum uss jahan mein jyu ni jaha tumhe hona thaaa...!?<br>
          Meri jnn iss jahan mein parion kaa anaa mnaa h...<br>
          Abb kyaa irade h tere hmein tbha krne k...?<br>
          Humne teri ankhon ko apna katil chuna h...!<br>
          Aur yeh soch k tujh prr mrr raha hu...<br>
          K hona sbb ko ek din fnaa h...
        </div>
        <div class="btn-group">
          <button class="primary-btn" onclick="showStep4()">Ik Last Gall... 🥺❤️</button>
        </div>
      `);
      burstHearts(25);
    }

    // 4th Animation: Final Heartfelt Message
    function showStep4() {
      triggerAnimation(`
        <div class="emoji-header">🥹💖♾️</div>
        <h1>From My Heart... ❤️</h1>
        <div class="thanks-msg">
          thnku kakeee for returning back into my life schi teri wait c gi meinu ki meri mdm tenu pehla mdm keh k gll krda hunda c aaj v ydd meinu ki tuc vapis aaonge teh tuc aaye but hun mein ni chohnda ki appa dubara aadd hoia so thonu apna bnona hmesha kol rkhna bkii mein force ni kru thonu j tuc mere nll khush o yaa apne layak smjhde o taa dsdeo and last bss ehi kehna ki loveee u jnneeee....! hope so tu hmesha mere nll rahe ❤️✨
        </div>
      `);
      burstHearts(45);
    }

    function createHeart() {
      const heart = document.createElement('div');
      heart.classList.add('heart-bg');
      const emojis = ['❤️', '💖', '💕', '✨', '🌸', '💘'];
      heart.innerText = emojis[Math.floor(Math.random() * emojis.length)];
      heart.style.left = Math.random() * 100 + 'vw';
      heart.style.animationDuration = (Math.random() * 3 + 3) + 's';
      heart.style.fontSize = (Math.random() * 20 + 18) + 'px';
      document.body.appendChild(heart);

      setTimeout(() => {
        heart.remove();
      }, 6000);
    }

    setInterval(createHeart, 350);
  </script>
</body>
</html>
